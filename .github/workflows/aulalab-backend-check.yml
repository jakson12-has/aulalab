name: AulaLab backend checks

on:
  pull_request:
    paths:
      - "AulaLab/backend/**"
      - ".github/workflows/aulalab-backend-check.yml"
  push:
    branches:
      - main
      - "fix/**"
    paths:
      - "AulaLab/backend/**"
      - ".github/workflows/aulalab-backend-check.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AulaLab/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        run: npm install --ignore-scripts
      - name: Check backend JavaScript syntax
        run: npm run check
